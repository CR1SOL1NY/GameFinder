# Plantilla para revisar antes de crear el servicio. No contiene credenciales.
services:
  - type: web
    name: gamefinder-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /interfaz/health/db
    autoDeployTrigger: "off"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: GameFinder
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: ""
