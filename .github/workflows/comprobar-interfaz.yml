name: Comprobar integración del frontend
on:
  push:
    branches: ['funcionalidad/integracion-frontend']
  pull_request:
    paths:
      - 'frontend/**'
      - 'integracion_frontend/**'
      - 'pruebas_interfaz/**'
      - 'main_interfaz.py'
      - 'requirements-*interfaz.lock.txt'
      - 'scripts/probar_integracion.py'
      - '.github/workflows/comprobar-interfaz.yml'
permissions:
  contents: read
jobs:
  verificar:
    name: Verificar en ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r requirements-pruebas-interfaz.lock.txt
      - name: Instalar frontend
        run: npm ci
        working-directory: frontend
      - name: Probar frontend
        run: npm test
        working-directory: frontend
      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
      - name: Probar compatibilidad sin Atlas
        run: python -m pytest pruebas_interfaz -q
      - name: Probar recorridos integrados sin Atlas
        run: python scripts/probar_integracion.py
